[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "sonarqube-monitor"
version = "0.1.0"
description = "SonarQube issue dashboard and issue list (FastAPI + Vue)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default.scripts]
# FastAPI/Uvicorn 공식 문서와 동일한 형태(앱에 --reload). 포트는 Vite 프록시(web/vite.config.js)와 맞춤.
dev = "uvicorn main:app --reload --host 127.0.0.1 --port 9999"
# python main.py — reload + .env 포함 감시 등은 main.py run_dev() 참고
start = "python main.py"
# 리로드 없이 고정 실행
serve = "uvicorn main:app --host 127.0.0.1 --port 9999"
# 관리 API·JSON 저장 검증: hatch run test
test = "python -m unittest discover -s tests -p 'test_*.py' -v"
