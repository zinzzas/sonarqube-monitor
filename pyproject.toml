[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "sonarqube-monitor"
version = "0.1.0"
description = "SonarQube issue dashboard and issue list (FastAPI + Vue)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default.scripts]
# 프로젝트 루트에서: hatch run start
start = "python main.py"
# 리로드 없이 고정 실행
serve = "uvicorn main:app --host 127.0.0.1 --port 9999"
# 관리 API·JSON 저장 검증: hatch run test
test = "python -m unittest discover -s tests -p 'test_*.py' -v"
